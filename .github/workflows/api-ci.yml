name: API CI

on:
  push:
    paths:
      - "slice/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "slice/api/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hexabout
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: hexabout_leagues_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hexabout -d hexabout_leagues_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hexabout:test_only_password@localhost:5432/hexabout_leagues_test
      DATABASE_URL: postgres://hexabout:test_only_password@localhost:5432/hexabout_leagues_test
      NODE_ENV: test
    defaults:
      run:
        working-directory: slice/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slice/api/package-lock.json
      - run: npm ci
      - name: Initialize test schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Record base schema migration
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()); INSERT INTO schema_migrations (version) VALUES ('000_base_schema.sql') ON CONFLICT DO NOTHING;"
      - name: Apply migrations
        run: npm run db:migrate:test
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
