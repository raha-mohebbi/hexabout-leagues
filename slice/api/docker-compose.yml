services:
  postgres:
    image: postgres:17-alpine
    container_name: hexabout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hexabout
      POSTGRES_PASSWORD: hexabout_dev_password
      POSTGRES_DB: hexabout_leagues
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexabout -d hexabout_leagues"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: